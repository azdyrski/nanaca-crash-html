<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nanaca Crash Flash Reference</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #17151b;
            color: #f5f1f4;
        }

        body {
            display: grid;
            justify-items: center;
            gap: 1rem;
            margin: 0;
            padding: 1.5rem;
        }

        #player {
            width: min(100%, 1100px, calc(78vh * 7 / 4));
            aspect-ratio: 7 / 4;
        }

        h1, p {
            margin: 0;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }

        #status {
            max-width: 70rem;
            color: #e6d8e0;
        }

        #status[data-error="true"] {
            color: #ff9a9a;
        }
    </style>
    <script src="./ruffle/ruffle.js"></script>
</head>
<body>
    <h1>Nanaca Crash — Flash reference</h1>
    <p id="status" role="status" aria-live="polite">Loading the original Flash game…</p>
    <div id="player"></div>
    <script>
        window.addEventListener("DOMContentLoaded", async () => {
            const status = document.getElementById("status");
            try {
                const ruffle = window.RufflePlayer?.newest();
                if (!ruffle) {
                    throw new Error("Ruffle did not initialize. Check that its local runtime files are served.");
                }

                const player = ruffle.createPlayer();
                player.setAttribute("aria-label", "Original Nanaca Crash Flash game");
                document.getElementById("player").appendChild(player);
                await player.ruffle().load("./nanaca-crash_v110.swf");
                status.textContent = "Reference build: nanaca-crash_v110.swf";
            } catch (error) {
                status.dataset.error = "true";
                status.textContent = `Unable to load the Flash reference: ${error.message}`;
                console.error(error);
            }
        }, { once: true });
    </script>
</body>
</html>
